<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alsh Bot 112777103</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:15px;margin:0}
.card{background:#181818;border-radius:20px;padding:20px;margin:15px auto;max-width:360px;border:1px solid #333}
input{width:90%;padding:14px;margin:8px 0;border-radius:12px;border:none;background:#222;color:#fff;text-align:center}
.btn{background:#c21e2a;color:#fff;padding:16px;border:none;border-radius:15px;width:95%;font-size:18px;margin-top:15px;cursor:pointer}
.trade{background:#1e1e1e;margin:6px 0;padding:10px;border-radius:10px;font-size:13px;text-align:left;direction:ltr}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="p1">
<h2>تسجيل دخول حساب التداول</h2>
<div class="card">
<p>ربط حساب التداول المباشر</p>
<input value="112777103" readonly>
<input type="password" value="********" readonly>
<input value="JustMarkets-Live" readonly>
<p style="color:#00ff88">✓ تم التحقق</p>
<button class="btn" onclick="p1.style.display='none';p2.style.display='block'">ربط - دخول</button>
</div>
</div>

<div id="p2" style="display:none">
<h2>اعدادات البوت</h2>
<div class="card">
<p>نسبة المخاطرة</p>
<h2 id="r">99%</h2>
<input type="range" min="5" max="100" value="99" style="width:90%" oninput="r.innerText=this.value+'%'">
<p>عدد الصفقات</p>
<h3 id="l">1 صفقات</h3>
<input type="range" min="1" max="150" value="1" style="width:90%" oninput="l.innerText=this.value+' صفقات'">
<label style="display:block;margin:15px"><input type="checkbox" checked> اعطاء البوت صلاحية التداول</label>
<button class="btn" onclick="p2.style.display='none';p3.style.display='block';setInterval(up,1000)">التشغيل الان</button>
</div>
</div>

<div id="p3" style="display:none">
<h3>Trade <span style="float:left">55.40</span></h3>
<div style="background:#222;border-radius:50%;width:90px;height:90px;margin:10px auto;display:flex;align-items:center;justify-content:center;border:3px solid #c21e2a;font-size:24px">🇮🇶<br>عراقي</div>
<h3 style="color:#c21e2a">البوت قيد العمل</h3>
<div style="width:140px;height:140px;border:5px solid #c21e2a;border-top-color:transparent;border-radius:50%;margin:20px auto;animation:spin 1s linear infinite"></div>
<p>Balance: 55.40<br><span id="pr" style="color:#00ff88">Profit: 0.00 USD</span></p>
<div id="pos"></div>
<button class="btn" style="background:#333" onclick="location.reload()">ايقاف البوت</button>
</div>

<script>
function up(){
document.getElementById('pr').innerText='Profit: '+(Math.random()*6).toFixed(2)+' USD';
let h='';for(let i=0;i<4;i++){h+='<div class=trade>XAUUSD.b, buy 0.01<br>4620.51 -> 4623.27 <span style=color:#0f0;float:right>'+(Math.random()*3).toFixed(2)+'</span></div>'}
document.getElementById('pos').innerHTML=h;
}
</script>
</body>
</html>
